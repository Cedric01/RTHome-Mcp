name: .NET CI/CD

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - run: dotnet restore RealEstate.Mcp/RealEstate.Mcp.csproj
    - run: dotnet build RealEstate.Mcp/RealEstate.Mcp.csproj --no-restore --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: ./RealEstate.Mcp/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/realestate-mcp:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/realestate-mcp:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    - name: Look up the RTHomePropertyManagement API URL
      id: api_url
      run: |
        URL=$(gcloud run services describe rthomepropertymanagement \
          --project=${{ secrets.GCP_PROJECT_ID }} \
          --region=europe-west1 \
          --format='value(status.url)')
        echo "url=$URL" >> "$GITHUB_OUTPUT"
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy realestate-mcp \
          --image=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/realestate-mcp:sha-${{ github.sha }} \
          --project=${{ secrets.GCP_PROJECT_ID }} \
          --region=europe-west1 \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --min-instances=0 \
          --max-instances=2 \
          --set-env-vars="RTHomeApi__BaseUrl=${{ steps.api_url.outputs.url }}"